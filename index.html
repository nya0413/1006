<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>바다그리기</title>
<style>
  :root{--bg:#e8f4fc;
        --fg:#0055aa;
        --btn:#1a2744;
        --on:#6fb8ff;
      box-sizing:border-box;
      padding-top:env(safe-area-inset-top,0px);
      padding-bottom:env(safe-area-inset-bottom,0px);
    }

  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  body{ background:var(--bg); color:var(--fg); font-family:sans-serif; text-align:center; margin:0; padding:16px; }
  h1{ font-size:1.2rem; margin:6px 0 12px; }
  button{ background:var(--btn); color:#e4ecff; border:0; border-radius:6px; padding:8px 12px; margin:3px; font-size:1rem; }
  button.on{ background:var(--on); color:#00203a; }
  #textMakeBut{ background:var(--on); color:#00203a; font-weight:bold; }
  input[type=text]{ font-size:1rem; text-align:center; }
  .row{ margin:10px 0; font-size:.9rem; color:#1a365d;}
  #monitor{ display:inline-block; text-align:left; font-family:monospace; white-space:pre; line-height:1.15; margin:14px 0 6px; min-height:30vh; }
  #info{ font-size:.75rem; opacity:.6; color:#333; }
</style>
</head>
<body>
<h1>나만의 바다를 만들어요!</h1>

<div id="picButs"></div>
<div class="row">
  그림 글자 <input type="text" id="wordInput" value="글자를 바꿔보세요" size="22">
</div>
<div class="row">
  글자 수 <input type="range" id="sizeBar" min="40" max="140" step="2" value="80">
  <span id="sizeText">80</span>
</div>
<button id="textMakeBut">그림그리기</button>
<button id="instantBut">바로 완성하기</button>
<br>
<div id="monitor">버튼을 누르면 그림이 그려져요.</div>
<div id="info"></div>

<script>
//변수
let a = 1;
let b = 0;
let W = 80, H = 68;
let dx = 2/W, dy = 2/H;
let row = 0, col = 0, n = 0;
let cells = [];
let timer;
let curName = "파도";

function instant(){
  reset();
  beachsnd.play().catch(e => console.log("재생 오류:", e)); // 파도소리 재생 추가
  
  for(let i = 0; row < H; i++){
    textMake();
  }
}

function dist(x, y, cx, cy){ return Math.hypot(x - cx, y - cy); }
function waveLine(x, y, base, amp, fq, ph){ return Math.abs(y - (base + amp*Math.sin(fq*x + ph))) < dy*0.8; }

let lip = [[-1.0, -0.55], [-0.7, -0.45], [-0.45, -0.2], [-0.3, 0.15], [-0.15, 0.45], [0.0, 0.62]];
function hcurve(x){
  if(x <= lip[0][0]) return lip[0][1];
  for(let i = 0; i < lip.length - 1; i++){
    let p = lip[i], q = lip[i+1];
    if(x <= q[0]) return p[1] + (x - p[0])/(q[0] - p[0]) * (q[1] - p[1]);
  }
  return lip[lip.length - 1][1];
}

function curl(x, y){
  let cx = 0.15, cy = 0.38;
  let d = dist(x, y, cx, cy);
  let a = Math.PI/2 - Math.atan2(y - cy, x - cx);
  a = ((a % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
  for(let k = 0; k < 2; k++){
    let t = a + 2*Math.PI*k;
    if(t > 3.1*Math.PI) continue;
    let r = 0.36 - 0.045*t;
    if(r > 0.05 && Math.abs(d - r) < 0.045) return true;
  }
  return false;
}


let pics = {
  "파도": function(x, y){
    if(x <= 0){                                                        // 
      let h = hcurve(x);
      if(y >= h) return false;
      let depth = h - y;
      return !(depth > 0.12 && ((depth*5) % 1) < 0.25);                // 
    }
    if(y > 0 && curl(x, y)) return true;                               // 
    let base = -0.55 + 0.05*Math.sin(9*x + 1);                         // 
    if(y < base){
      let depth = base - y;
      return !(depth > 0.08 && ((depth*5) % 1) < 0.25);
    }
    let spray = [[0.5, 0.52], [0.58, 0.4], [0.55, 0.62], [0.68, 0.3], [0.2, 0.78], [0.35, 0.74]];
    for(let i = 0; i < spray.length; i++){                             // 
      if(dist(x, y, spray[i][0], spray[i][1]) < 0.035) return true;
    }
    return false;
  },

  "고래": function(x, y){
    let t = x + 0.2, hw = Math.abs(t) < 0.7 ? 0.33*Math.sqrt(1 - Math.pow(t/0.7, 2)) : 0;
    if(dist(x, y, -0.62, 0.05) < 0.05) return false;
    if(hw > 0 && y <= hw && y >= -0.9*hw) return true;
    if(x > 0.45 && x < 0.8 && Math.abs(y - (x - 0.5)) < 0.07*(1 - (x - 0.45)/0.4) + 0.025) return true;
    if(Math.abs(x - 0.8) < 0.2 && Math.abs(y - (0.3 + 1.3*Math.abs(x - 0.8))) < 0.055) return true;
    let s = x + 0.35;
    if(y > 0.3 && Math.abs(s) < 0.22 && Math.abs(y - (0.7 - 12*s*s)) < dy*0.8) return true;
    if(y > 0.3 && y < 0.6 && Math.abs(s) < dx*0.8) return true;
    return waveLine(x, y, -0.62, 0.04, 8, 0) || waveLine(x, y, -0.82, 0.05, 6, 2);
  },
  "범선": function(x, y){
    if(dist(x, y, 0.7, 0.68) < 0.17) return true;
    if(y > -0.5 && y < -0.34 && Math.abs(x) < 0.32 + (y + 0.5)*2.2) return true;
    if(Math.abs(x) < Math.max(0.025, dx*0.7) && y > -0.34 && y < 0.85) return true;
    let line = ((y*20) % 1 + 1) % 1 > 0.2;
    if(x > 0.03 && x < 0.58 && y > -0.3 && y < -0.3 + (1 - (x - 0.03)/0.55)*1.0) return line;
    if(x < -0.03 && x > -0.52 && y > -0.3 && y < -0.3 + (1 - (-0.03 - x)/0.49)*0.85) return line;
    if(y > 0.85 && y < 0.93 && x > 0 && x < 0.12) return true;
    return waveLine(x, y, -0.62, 0.05, 8, 0) || waveLine(x, y, -0.82, 0.06, 6, 1.5);
  },
  "해파리": function(x, y){
    let d = dist(x, y, 0, 0.15);
    if(dist(x, y, -0.2, 0.42) < 0.07) return false;
    if(y > 0.15 && d < 0.55) return true;
    if(y <= 0.15 && y > 0.02 && Math.abs(x) < 0.55 && Math.sin(x*30) > -0.2) return true;
    if(y < 0.02 && y > -0.6 && Math.abs(x - 0.07*Math.sin(6*y)) < dx*1.5) return true;
    if(y < 0.02 && y > -0.95){
      for(let k = 0; k < 6; k++){
        let xt = -0.45 + 0.18*k;
        if(Math.abs(x - xt - 0.06*Math.sin(9*y + k)) < dx*1.2) return true;
      }
    }
    return false;
  },
  "소라": function(x, y){
    let wh = [[-0.15, -0.2, 0.55, 0.42], [0.05, 0.25, 0.4, 0.22], [0.17, 0.52, 0.28, 0.14], [0.25, 0.7, 0.18, 0.1], [0.3, 0.82, 0.08, 0.07]];
    let e = [];
    let inside = false;
    for(let i = 0; i < wh.length; i++){
      e[i] = Math.pow((x - wh[i][0])/wh[i][2], 2) + Math.pow((y - wh[i][1])/wh[i][3], 2);
      if(e[i] <= 1) inside = true;
    }
    let m = Math.pow((x + 0.38)/0.14, 2) + Math.pow((y + 0.25)/0.26, 2);
    if(m < 0.55) return false;
    if(m < 1) return true;
    for(let i = 0; i < 3; i++){
      let bx = wh[i][0] + wh[i][2]*0.85;
      if(x > bx && x < bx + 0.14 && Math.abs(y - (wh[i][1] + wh[i][3]*0.35)) < 0.07*(1 - (x - bx)/0.14)) return true;
    }
    if(!inside) return false;
    for(let i = 0; i < 4; i++){
      if(e[i] > 0.8 && e[i] < 0.92 && y > wh[i][1] && e[i+1] > 1) return false;
    }
    return !(((x*5 - y*2) % 1 + 1) % 1 < 0.06);
  }
};

function make(){
  W = Number(sizeBar.value);
  H = Math.round(W * 0.85);
  dx = 2/W; dy = 2/H;
  cells = [];
  for(let r = 0; r < H; r++){
    for(let c = 0; c < W; c++){
      let x = (c - (W-1)/2) / ((W-1)/2);
      let y = ((H-1)/2 - r) / ((H-1)/2);
      cells.push(pics[curName](x, y));
    }
  }
  monitor.style.fontSize = Math.min(12, (window.innerWidth - 32) / W) + "px";
}
function textMake(){
  a++;
  b = b + a;
  let text = (wordInput.value || "바다").replace(/[ ~]/g, "");
  if(cells[row * W + col]){
    monitor.textContent += text[n % text.length];
    n++;
  } else {
    monitor.textContent += "~~";
  }
  col++;
  if(col >= W){
    monitor.textContent += "\n";
    col = 0;
    row++;
  }
  info.innerHTML = "a = " + a + " , b = " + b + " , 글자 수 " + n + "개";
}

function reset(){
  clearInterval(timer);
  make();
  monitor.textContent = "";
  row = 0; col = 0; n = 0; a = 1; b = 0;
}
function start(){
  reset();
  let per = Math.ceil(W * H / 150);
  timer = setInterval(function(){
    for(let i = 0; i < per; i++){
      if(row >= H){ clearInterval(timer); return; }
      textMake();
    }
  }, 30);
}
function instant(){
  reset();
  for(let i = 0; row < H; i++){
    textMake();
  }
}

function makeButtons(){
  picButs.innerHTML = "";
  for(let name in pics){
    let but = document.createElement("button");
    but.textContent = name;
    if(name == curName) but.className = "on";
    but.onclick = function(){
      curName = name;
      makeButtons();
      start();
    };
    picButs.appendChild(but);
  }
}

textMakeBut.onclick = function(){
  start();
  console.log("clicked!!");
}
instantBut.onclick = instant;
sizeBar.oninput = function(){ sizeText.innerHTML = sizeBar.value; }
sizeBar.onchange = start;
wordInput.onchange = start;

makeButtons();
</script>
</body>
</html>
